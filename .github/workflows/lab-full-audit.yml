name: Lab Full Audit

# Expensive certification before promoting laboratory work into dev.
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  lab-full-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check authored mechanics
        run: npm run test:mechanics

      - name: Check mechanic behavior contracts
        run: npm run test:mechanic-behavior

      - name: Check authored geometry
        run: npm run test:geometry

      - name: Check authored clearance
        run: npm run test:clearance

      - name: Full adversarial campaign audit
        env:
          FULL_AUDIT: "1"
        run: npm run audit:courses

      - name: Audit 2.0 full human-model report
        run: npm run audit:human:full

      - name: Audit 2.0 difficulty and design advice
        run: npm run audit:design

      - name: Check course originality
        run: npm run audit:originality

      - name: Upload full audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-2-full-report
          path: |
            artifacts/audit2-report.*
            artifacts/audit2-design.*
          if-no-files-found: warn
