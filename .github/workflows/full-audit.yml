name: Full Audit

on:
  push:
    branches: [dev]
    paths:
      - "src/data/authored/**"
      - "src/systems/GolfSimulation.ts"
      - "src/systems/CourseValidation.ts"
      - "scripts/courseAudit.ts"
      - ".github/workflows/full-audit.yml"
  workflow_dispatch:

jobs:
  full-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Full authored campaign audit
        env:
          FULL_AUDIT: "1"
        run: npm run audit:courses
