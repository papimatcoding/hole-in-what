name: Lab Smoke Checks

# Fast technical feedback for feature branches. This workflow is NOT level-design certification.
on:
  push:
    branches:
      - "feature/**"
      - "audit-*"
      - "lab/**"
  workflow_dispatch:

concurrency:
  group: lab-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check hole physics
        run: npm run test:hole

      - name: Check authored mechanics
        run: npm run test:mechanics

      - name: Check mechanic behavior contracts
        run: npm run test:mechanic-behavior

      - name: Check authored geometry
        run: npm run test:geometry

      - name: Check authored clearance
        run: npm run test:clearance

# Authored level acceptance lives exclusively in lab-full-audit.yml.
# Do not use a fast human-model/solver pass to approve, reject or retune a level.
