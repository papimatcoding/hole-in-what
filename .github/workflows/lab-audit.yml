name: Lab Audit

# Development-only certification. Feature/lab branches never deploy GitHub Pages.
on:
  push:
    branches:
      - "feature/**"
      - "audit-*"
      - "lab/**"
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  lab-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check hole physics
        run: npm run test:hole

      - name: Check authored mechanics
        run: npm run test:mechanics

      - name: Check authored geometry
        run: npm run test:geometry

      - name: Check authored clearance
        run: npm run test:clearance

      - name: Existing adversarial campaign audit
        env:
          FULL_AUDIT: "1"
        run: npm run audit:courses

      - name: Audit 2.0 human-model report
        env:
          AUDIT2_MODE: "full"
        run: npm run audit:human

      - name: Check course originality
        run: npm run audit:originality

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-2-report
          path: artifacts/audit2-report.*
          if-no-files-found: warn
